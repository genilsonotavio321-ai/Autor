<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="meta-theme-color" content="#fafafa">
  <meta name="description" content="Escreva, revise e exporte seus livros e histórias. Funciona offline; seus dados ficam apenas no seu aparelho.">
  <title>Autor — seus livros e histórias</title>

  <!-- App instalável (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Autor">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <!-- ===================== SPRITE DE ÍCONES ===================== -->
  <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute">
    <symbol id="i-feather" viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></symbol>

    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="3.5" y1="3.5" x2="5.3" y2="5.3"/><line x1="18.7" y1="18.7" x2="20.5" y2="20.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="3.5" y1="20.5" x2="5.3" y2="18.7"/><line x1="18.7" y1="5.3" x2="20.5" y2="3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/><line x1="12" y1="7" x2="12" y2="21"/></symbol>

    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 2.5l1.7 4.9 4.8 1.6-4.8 1.6L12 15.5l-1.7-4.9L5.5 9l4.8-1.6z"/><path d="M19 14l.8 2.3 2.2.7-2.2.7L19 20l-.8-2.3-2.2-.7 2.2-.7z"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-align-left" viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></symbol>
    <symbol id="i-align-center" viewBox="0 0 24 24"><line x1="17" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="7" y2="18"/></symbol>
    <symbol id="i-align-right" viewBox="0 0 24 24"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></symbol>
    <symbol id="i-align-justify" viewBox="0 0 24 24"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></symbol>
  </svg>

  <!-- ===================== BARRA SUPERIOR ===================== -->
  <header class="topbar">
    <button id="btn-home" class="brand" title="Ir para a prateleira">
      <svg class="ic" aria-hidden="true"><use href="#i-feather"></use></svg>
      <span translate="no">Autor</span>
    </button>
    <div class="topbar-actions">
      <button id="btn-global-search" class="icon-btn" title="Buscar em todas as obras (Ctrl+K)" aria-label="Buscar em todas as obras">
        <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
      </button>
      <button id="btn-trash-open" class="icon-btn" title="Lixeira" aria-label="Abrir lixeira">
        <svg class="ic" aria-hidden="true"><use href="#i-trash"></use></svg>
      </button>
      <button id="btn-settings-open" class="icon-btn" title="Configurações" aria-label="Abrir configurações">
        <svg class="ic" aria-hidden="true"><use href="#i-settings"></use></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="Alternar tema" aria-label="Alternar tema claro/escuro">
        <svg class="ic" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </div>
  </header>

  <main id="main">

    <!-- ===================== PRATELEIRA ===================== -->
    <section id="view-shelf" class="view active">
      <div class="view-header">
        <h1>Minhas obras</h1>
        <button id="btn-new-book" class="btn primary">
          <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Novo livro
        </button>
      </div>
      <div class="shelf-toolbar">
        <input id="shelf-search" type="search" placeholder="Filtrar por título ou autor…" aria-label="Filtrar por título ou autor">
        <select id="shelf-filter" title="Filtrar por status" aria-label="Filtrar por status">
          <option value="all">Todos os status</option>
          <option value="rascunho">Rascunho</option>
          <option value="revisao">Em revisão</option>
          <option value="concluido">Concluído</option>
        </select>
      </div>
      <div id="book-grid" class="book-grid"></div>
      <div id="shelf-empty" class="empty-state hidden">
        <p class="big"><svg class="ic" aria-hidden="true"><use href="#i-book"></use></svg></p>
        <p>Nenhuma obra por aqui ainda.</p>
        <p>Clique em <strong>Novo livro</strong> para começar a escrever.</p>
      </div>
    </section>

    <!-- ===================== LIVRO ===================== -->
    <section id="view-book" class="view">
      <div class="view-header">
        <button class="btn ghost" data-back="shelf">
          <svg class="ic" aria-hidden="true"><use href="#i-arrow-left"></use></svg> Prateleira
        </button>
        <div class="book-actions">
          <button id="btn-read-book" class="btn">
            <svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg> Ler
          </button>
          <button id="btn-export-book" class="btn">
            <svg class="ic" aria-hidden="true"><use href="#i-download"></use></svg> Exportar
          </button>
          <button id="btn-edit-book" class="btn">
            <svg class="ic" aria-hidden="true"><use href="#i-edit"></use></svg> Editar
          </button>
          <button id="btn-delete-book" class="btn danger">
            <svg class="ic" aria-hidden="true"><use href="#i-trash"></use></svg> Excluir
          </button>
        </div>
      </div>
      <div class="book-header">
        <img id="book-cover" class="book-cover hidden" alt="">
        <div class="book-header-info">
          <h1 id="book-title"></h1>
          <p id="book-author" class="muted"></p>
          <p id="book-desc"></p>
          <div class="book-meta">
            <select id="book-status" title="Status da obra" aria-label="Status da obra">
              <option value="rascunho">Rascunho</option>
              <option value="revisao">Em revisão</option>
              <option value="concluido">Concluído</option>
            </select>
            <span id="book-stats" class="muted"></span>
          </div>
        </div>
      </div>
      <div class="view-subheader">
        <h2>Capítulos</h2>
        <button id="btn-add-chapter" class="btn primary">
          <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Novo capítulo
        </button>
      </div>
      <ol id="chapter-list" class="chapter-list"></ol>
      <p id="book-empty-chapters" class="empty-state hidden">Este livro ainda não tem capítulos. Clique em <strong>Novo capítulo</strong>.</p>
    </section>

    <!-- ===================== EDITOR ===================== -->
    <section id="view-editor" class="view">
      <div class="editor-topbar">
        <button class="btn ghost" id="btn-back-book">
          <svg class="ic" aria-hidden="true"><use href="#i-arrow-left"></use></svg> Capítulos
        </button>
        <input id="chapter-title" class="chapter-title-input" placeholder="Título do capítulo" aria-label="Título do capítulo" autocomplete="off">
        <span id="save-indicator" class="save-indicator" role="status" aria-live="polite"></span>
        <div class="editor-actions">
          <button id="btn-review" class="btn">
            <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg> Revisar
          </button>
          <button id="btn-replace" class="btn" title="Substituir uma palavra em todo o capítulo (Ctrl+H)">
            <svg class="ic" aria-hidden="true"><use href="#i-repeat"></use></svg> Substituir
          </button>
          <button id="btn-chapter-cover" class="btn" title="Escolher uma capa para o capítulo">
            <svg class="ic" aria-hidden="true"><use href="#i-image"></use></svg> Capa
          </button>
          <button id="btn-read-chapter" class="btn">
            <svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg> Ler
          </button>
          <button id="btn-export-chapter" class="btn">
            <svg class="ic" aria-hidden="true"><use href="#i-download"></use></svg> Exportar
          </button>
          <button id="btn-delete-chapter" class="btn danger" title="Excluir capítulo" aria-label="Excluir capítulo">
            <svg class="ic" aria-hidden="true"><use href="#i-trash"></use></svg>
          </button>
        </div>
      </div>
      <div class="editor-toolbar" role="toolbar" aria-label="Alinhamento do texto">
        <span class="et-label">Alinhamento</span>
        <button type="button" class="icon-btn align-btn" data-align="e" aria-label="Alinhar à esquerda" title="Alinhar à esquerda">
          <svg class="ic" aria-hidden="true"><use href="#i-align-left"></use></svg>
        </button>
        <button type="button" class="icon-btn align-btn" data-align="c" aria-label="Centralizar" title="Centralizar">
          <svg class="ic" aria-hidden="true"><use href="#i-align-center"></use></svg>
        </button>
        <button type="button" class="icon-btn align-btn" data-align="d" aria-label="Alinhar à direita" title="Alinhar à direita">
          <svg class="ic" aria-hidden="true"><use href="#i-align-right"></use></svg>
        </button>
        <button type="button" class="icon-btn align-btn" data-align="j" aria-label="Justificar" title="Justificar">
          <svg class="ic" aria-hidden="true"><use href="#i-align-justify"></use></svg>
        </button>
        <select id="align-scope" title="Onde aplicar o alinhamento" aria-label="Onde aplicar o alinhamento">
          <option value="para">Só este parágrafo</option>
          <option value="chapter">Capítulo inteiro</option>
        </select>
        <span id="align-current" class="muted et-current" aria-live="polite"></span>
      </div>
      <div class="editor-body">
        <textarea id="chapter-content" spellcheck="true" lang="pt-BR"
          placeholder="Comece a escrever…&#10;&#10;Dica: use três travessões (---) em uma linha vazia para marcar uma quebra de página no PDF."></textarea>
        <aside id="review-panel" class="review-panel hidden"></aside>
      </div>
      <div class="editor-footer">
        <span class="footer-left">
          <label class="muted" for="chapter-status">Status</label>
          <select id="chapter-status" title="Status do capítulo" aria-label="Status do capítulo">
            <option value="rascunho">Rascunho</option>
            <option value="revisao">Em revisão</option>
            <option value="concluido">Concluído</option>
          </select>
          <span id="editor-stats" class="muted"></span>
        </span>
        <span class="muted spellcheck-hint"
          title="A ortografia é conferida pelo corretor do navegador em português (pt-BR). Clique com o botão direito em palavras sublinhadas de vermelho.">
          Ortografia nativa (pt-BR) ativa
        </span>
      </div>
    </section>

    <!-- ===================== LEITOR ===================== -->
    <section id="view-reader" class="view" data-reader-theme="light">
      <div class="reader-topbar">
        <button id="btn-close-reader" class="btn ghost">
          <svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg> Fechar
        </button>
        <span id="reader-progress" class="muted"></span>
        <div class="reader-controls">
          <button id="reader-font-minus" class="icon-btn" title="Diminuir fonte" aria-label="Diminuir fonte">A−</button>
          <button id="reader-font-plus" class="icon-btn" title="Aumentar fonte" aria-label="Aumentar fonte">A+</button>
          <button id="reader-font-serif" class="btn small" title="Alternar entre fonte serifada e sem serifa">Serif</button>
          <select id="reader-theme" title="Tema do leitor" aria-label="Tema do leitor">
            <option value="light">Claro</option>
            <option value="sepia">Sépia</option>
            <option value="dark">Escuro</option>
          </select>
        </div>
      </div>
      <article id="reader-content" class="reader-content"></article>
    </section>

  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/review.js"></script>
  <script src="js/export.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
